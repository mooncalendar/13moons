name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimum permissions the Pages deploy needs: read the repo, write to Pages
# and request the OIDC token the deployment is signed with.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; the one already in flight is not cancelled, so the
# site never ends up half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Prepare the site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Copy only the app (no tests, no docs)
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html app.js i18n.js _site/
          # no Jekyll: underscore names plus .nojekyll stop Pages from
          # processing the site as a template
          touch _site/.nojekyll

      - name: Check the artefact is complete
        run: |
          set -euo pipefail
          for f in index.html app.js i18n.js; do
            test -s "_site/$f" || { echo "missing _site/$f"; exit 1; }
          done
          # every <script src> in the HTML has to exist in the artefact:
          # a file left out of the cp would leave the page blank
          refs=$(grep -o 'src="[^"]*\.js"' _site/index.html | sed 's/src="//; s/"$//')
          echo "references: $(echo $refs)"
          for f in $refs; do
            test -f "_site/$f" || { echo "broken reference: $f"; exit 1; }
          done
          echo "artefact OK: $(du -sh _site | cut -f1)"

      # Tries to enable Pages through the API. It almost always fails: creating
      # the site requires admin permission and GITHUB_TOKEN does not have it, so
      # this step is best-effort and the next one is what actually decides.
      - name: Try to enable Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Pages is enabled once, by hand, in Settings → Pages. Without it the
      # deploy fails later with a generic error; here it says what to do and
      # stops before spending the rest of the work.
      - name: Check that Pages is enabled
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || true)
          echo "Pages API: HTTP $code"
          if [ "$code" != "200" ]; then
            {
              echo "::error title=Pages is not enabled::GitHub Pages is not enabled yet on ${{ github.repository }}."
              echo "Enable it once: Settings → Pages → Source: GitHub Actions."
              echo "Then run this workflow again (Actions → Run workflow)."
            } >&2
            echo "### A manual step is missing" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "Enable Pages once in **Settings → Pages → Source: GitHub Actions**." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi
          cat /tmp/pages.json | head -c 300

      - name: Package the artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check the site answers and serves the app
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}"
          # Pages takes a few seconds to propagate the new deployment
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/index.html -w '%{http_code}' "$url" || true)
            [ "$code" = "200" ] && break
            echo "attempt $i: HTTP ${code:-no answer}, waiting…"
            sleep 6
          done
          test "${code:-000}" = "200" || { echo "index.html returns ${code:-000}"; exit 1; }
          test -s /tmp/index.html || { echo "index.html is empty"; exit 1; }
          # that it is the app and not an error page in disguise
          grep -q '13 Lunas' /tmp/index.html || { echo "the HTML does not look like the app"; exit 1; }
          grep -q 'src="app.js"' /tmp/index.html || { echo "app.js reference is missing"; exit 1; }
          for asset in app.js i18n.js; do
            curl -fsS "${url}${asset}" -o "/tmp/$asset"
            test -s "/tmp/$asset" || { echo "$asset is not served"; exit 1; }
            echo "$asset: $(wc -c < "/tmp/$asset") bytes"
          done
          echo "published and readable: $url"

      - name: Summary
        run: |
          echo "### Published" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "${{ steps.deployment.outputs.page_url }}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
