name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos que necesita el despliegue de Pages: leer el repo,
# escribir en Pages y pedir el token OIDC con el que firma el despliegue.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no se cancela el que ya está en vuelo para no
# dejar el sitio a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Preparar el sitio
    runs-on: ubuntu-latest
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Copiar sólo la app (sin pruebas ni documentación)
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html app.js i18n.js _site/
          # sin Jekyll: los nombres con guion bajo y el .nojekyll evitan
          # que Pages intente procesar el sitio como plantilla
          touch _site/.nojekyll

      - name: Comprobar que el artefacto está completo
        run: |
          set -euo pipefail
          for f in index.html app.js i18n.js; do
            test -s "_site/$f" || { echo "falta _site/$f"; exit 1; }
          done
          # cada <script src> del HTML tiene que existir en el artefacto:
          # un archivo olvidado en el cp dejaría la página en blanco
          refs=$(grep -o 'src="[^"]*\.js"' _site/index.html | sed 's/src="//; s/"$//')
          echo "referencias: $(echo $refs)"
          for f in $refs; do
            test -f "_site/$f" || { echo "referencia rota: $f"; exit 1; }
          done
          echo "artefacto OK: $(du -sh _site | cut -f1)"

      - name: Activar Pages si aún no lo está
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Desplegar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comprobar que el sitio responde y sirve la app
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}"
          # Pages tarda unos segundos en propagar el despliegue nuevo
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/index.html -w '%{http_code}' "$url" || true)
            [ "$code" = "200" ] && break
            echo "intento $i: HTTP ${code:-sin respuesta}, esperando…"
            sleep 6
          done
          test "${code:-000}" = "200" || { echo "index.html devuelve ${code:-000}"; exit 1; }
          test -s /tmp/index.html || { echo "index.html vacío"; exit 1; }
          # que sea la app y no una página de error disfrazada
          grep -q '13 Lunas' /tmp/index.html || { echo "el HTML no parece la app"; exit 1; }
          grep -q 'src="app.js"' /tmp/index.html || { echo "falta la referencia a app.js"; exit 1; }
          for asset in app.js i18n.js; do
            curl -fsS "${url}${asset}" -o "/tmp/$asset"
            test -s "/tmp/$asset" || { echo "$asset no se sirve"; exit 1; }
            echo "$asset: $(wc -c < "/tmp/$asset") bytes"
          done
          echo "publicado y legible: $url"

      - name: Resumen
        run: |
          echo "### Publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"